  maven-build-reporting:
    needs: shai-hulud-detector
    runs-on: ubuntu-latest
    steps:
    - name: Get short SHA
      uses: benjlevesque/short-sha@v3.0
      id: short-sha
    - name: Store short SHA as environment variable
      run: echo $SHA
      env:
        SHA: ${{ steps.short-sha.outputs.sha }}
    - name: Set env
      run: echo "TAG_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: Test tag name
      run: |
        echo $TAG_NAME
        echo ${{ env.TAG_NAME }}
    -
      name: Checkout repository
      uses: actions/checkout@v6.0.2
    -
      name: Build Test Reporting
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '25'
        distribution: 'adopt'
    -
      name: Cache Maven packages
      uses: actions/cache@v5.0.5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    -
      name: Build with Maven
      run: mvn clean install -e -Dsebserver-version="${{ env.TAG_NAME }}-${{ env.SHA }}"
      env:
        sebserver-version: ${{ env.TAG_NAME }}-${{ env.SHA }}

    - name: Simplify package name
      run: mv target/seb-server-${{ env.TAG_NAME }}-${{ env.SHA }}.jar target/seb-server.jar
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: Package
        path: target/seb-server.jar

  docker-admin-build:
    needs: maven-build-reporting
    # Run only on tagging
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Set env
        run: echo "TAG_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Test
        run: |
          echo $TAG_NAME
          echo ${{ env.TAG_NAME }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Login to DockerHub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_ADMIN_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ADMIN_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Download a single artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: Package
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            sebadmin/seb-server:${{ env.TAG_NAME }}
        
  cleanup:
    needs: [maven-build-reporting, docker-admin-build]
    if: |
      always()
    runs-on: ubuntu-latest
    steps:
    -
      name: Delete Artifacts
      uses: geekyeggo/delete-artifact@v6
      with:
          name: Package
