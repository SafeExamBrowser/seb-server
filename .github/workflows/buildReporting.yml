# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: build

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches: [master, development]

jobs:
  shai-hulud-detector:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout seb-server repo
      uses: actions/checkout@v6.0.2
      with:
        path: seb
        clean: false
    - name: Checkout Cobenian/shai-hulud-detect
      uses: actions/checkout@v6.0.2
      with:
        repository: Cobenian/shai-hulud-detect
        path: hulud
        clean: false
    - # Pipeline will automatically fail on exit codes 1 or 2
      name: Security Scan with Shai-Hulud Detector
      run: |
        chmod +x ./hulud/shai-hulud-detector.sh
        ./hulud/shai-hulud-detector.sh ./seb

  maven-build-reporting:
    needs: shai-hulud-detector
    runs-on: ubuntu-latest
    steps:
    - name: Get short SHA
      uses: benjlevesque/short-sha@v3.0
      id: short-sha
    - name: Store short SHA as environment variable
      run: echo $SHA
      env:
        SHA: ${{ steps.short-sha.outputs.sha }}
    - name: Set env
      run: echo "TAG_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: Test tag name
      run: |
        echo $TAG_NAME
        echo ${{ env.TAG_NAME }}
    -
      name: Checkout repository
      uses: actions/checkout@v6.0.2
    -
      name: Build Test Reporting
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '21'
        distribution: 'adopt'
    -
      name: Cache Maven packages
      uses: actions/cache@v5.0.5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    -
      name: Build with Maven
      run: mvn clean install -e -Dsebserver-version="${{ env.TAG_NAME }}-${{ env.SHA }}"
      env:
        sebserver-version: ${{ env.TAG_NAME }}-${{ env.SHA }}

    - name: Simplify package name
      run: mv target/seb-server-${{ env.TAG_NAME }}-${{ env.SHA }}.jar target/seb-server.jar
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: Package
        path: target/seb-server.jar

